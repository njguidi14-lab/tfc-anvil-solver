org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod identity
mod_id=anvilsolver
mod_name=Anvil Solver
mod_version=1.1.0
# LGPL-3.0: forks must stay open under the same terms, which blocks closed-source
# reuploads while keeping the mod free to use and to bundle in modpacks. Also on the
# EUPL-1.2 compatible-licence list, and TFC (which this mod builds against) is EUPL-1.2.
mod_license=LGPL-3.0-or-later
mod_group_id=com.njguidi14
mod_authors=njguidi14
mod_description=Shows the fewest-press path to a Perfectly Forged result in the TFC anvil GUI, with live tracking of your presses.

# Loader / toolchain
minecraft_version=1.21.1
neo_version=21.1.248
moddev_plugin_version=2.0.142

# Dependencies
tfc_version=4.2.6
# Required transitively by TFC (TFC declares patchouli as a hard dependency), but the
# Modrinth maven does not resolve transitive mod deps, so it must be pinned here too.
patchouli_version=1.21.1-93-neoforge
